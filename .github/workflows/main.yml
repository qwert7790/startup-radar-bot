name: Startup Radar publisher

on:
  schedule:
    # UTC; approximate 5-minute cadence (GitHub may delay or skip scheduled runs)
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      check_translation:
        description: "Check Russian translation without sending to Telegram"
        type: boolean
        default: false
      test_message:
        description: 'Send a test Telegram message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: startup-radar-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Russian translation
        if: ${{ inputs.check_translation || github.ref_name != github.event.repository.default_branch }}
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python -c 'from bot import translate_to_russian; print(translate_to_russian("A tool that organizes customer feedback and routes requests to specialists."))'
      - name: Collect projects or send test
        if: ${{ !inputs.check_translation && github.ref_name == github.event.repository.default_branch }}
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          DATABASE_PATH: ./data/startup_radar.sqlite3
          SKIP_EXISTING_ON_FIRST_RUN: 'true'
          MAX_POSTS_PER_CYCLE: '15'
          TEST_MESSAGE: ${{ inputs.test_message || 'false' }}
        run: python run_once.py
      - name: Save history even if some sources fail
        if: ${{ always() && steps.collect.outcome != 'skipped' && inputs.test_message != true }}
        run: |
          if [ -f data/startup_radar.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/startup_radar.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m "Update publication history [skip ci]"
              git push
            fi
          fi
